<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 짝맞추기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">WayMaker Mini Game</p>
        <h1>카드 짝맞추기</h1>
      </div>
      <button id="restart-btn" class="restart-btn" type="button">새 게임</button>
    </header>

    <section class="status-bar" aria-label="게임 상태">
      <div class="stat">
        <span>점수</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span>기록</span>
        <strong id="best-score">0</strong>
      </div>
      <div class="stat">
        <span>시도</span>
        <strong id="moves">0</strong>
      </div>
      <div class="stat">
        <span>시간</span>
        <strong id="time">00:00</strong>
      </div>
    </section>

    <p id="message" class="message">카드를 뒤집어 보세요!</p>

    <section id="game-board" class="game-board" aria-label="카드 보드"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
