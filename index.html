<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WayMaker Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>🧭 WayMaker Todo</h1>
    <p class="subtitle">오늘 할 일을 적어보세요!</p>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <button type="submit">추가</button>
    </form>

    <ul id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
